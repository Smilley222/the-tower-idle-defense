{id:'the-tower',name:'The Tower',subtitle:'Idle Defense',genre:'strategy',tag:['Idle defense','Défense incrémentale'],color:'#bea0ff',status:['V1.5 build available','Version V1.5 disponible'],desc:['One tower. Relentless waves. Build your defenses, push your limits, and make every run count.','Une tour. Des vagues incessantes. Renforcez vos défenses, repoussez vos limites et progressez à chaque partie.'],long:['A sci-fi defense game built around automatic targeting, in-run upgrades and a permanent Workshop. Version V1.5 adds coin rewards for cleared waves, a persistent Coin Vault, and three selectable visual styles plus other themes. Full browser and phone verification is still pending.','Un jeu de défense de science-fiction avec ciblage automatique, améliorations en partie et atelier permanent. La version V1.5 ajoute des pièces après les vagues, une réserve permanente et plusieurs thèmes visuels. La vérification complète sur navigateur et téléphone reste à faire.'],controls:['Keyboard and pointer controls in source. Touch layout pending verification. No controller implementation found.','Commandes au clavier et au pointeur présentes dans le code. Interface tactile à vérifier. Aucune prise en charge de manette trouvée.'],version:'1.5',save:['Permanent Workshop progression; export/import code present.','Progression permanente de l’atelier; code d’exportation et d’importation présent.']},

ate is promised yet.','Vérifier The Tower sur ordinateur et téléphone, tester le transfert des sauvegardes, puis intégrer une première version jouable. La sortie publique suivra une validation. Aucune date n’est encore promise.')}</p></div></article></div>`}
function about(){return intro(t('Independent by nature.','Indépendant par nature.'),t('GEO Arcade is a home for Geo’s original game projects. Different genres, a shared curiosity, and room to build something worth coming back to.','GEO Arcade réunit les projets de jeux originaux de Geo. Des genres variés, une curiosité commune et l’envie de créer un lieu où revenir.'))+`<section class="prose"><h2>${t('Small beginnings. Deliberate releases.','Des débuts modestes. Des sorties réfléchies.')}</h2><p>${t('The plan is simple: prepare one complete browser game, learn from real players, and expand when the experience is ready. Existing projects are the foundation.','Le plan est simple : préparer un jeu complet pour navigateur, apprendre des joueurs et agrandir la collection quand l’expérience sera prête. Les projets existants constituent la base.')}</p><h2>${t('Free to play is the goal.','Le jeu gratuit est l’objectif.')}</h2><p>${t('Future advertising may help support development. For now, there are no live ads, payments or accounts in this website layout. Advertising approval and revenue are not guaranteed.','La publicité pourrait un jour soutenir le développement. Pour l’instant, cette version du site ne contient aucune publicité active, paiement ou compte. L’approbation publicitaire et les revenus ne sont pas garantis.')}</p><h2>${t('Further down the road','Plus loin à l’horizon')}</h2><p>LAST CONVOY · Afterfall · Lanternfall</p><p>${t('Future additions to the arcade. Not included in the current source audit or launch lineup.','Ajouts futurs à l’arcade. Non inclus dans l’audit actuel ni dans la sélection de lancement.')}</p><a class="btn" href="#/library">${t('Explore the collection','Explorer la collection')} ↗</a></section>`}
function privacy(){return intro(t('Privacy, plainly.','La confidentialité, simplement.'),t('This notice describes the current website layout. It must be reviewed before public launch or when services are added.','Cet avis décrit la version actuelle du site. Il doit être révisé avant le lancement public ou l’ajout de services.'))+`<section class="prose"><div class="notice">${t('Pre-launch notice · Updated November 12, 2026','Avis avant lancement · Mis à jour le 12 novembre 2026')}</div><h2>${t('What this website stores','Ce que ce site enregistre')}</h2><p>${t('Your selected language and favorite game IDs can be stored in your browser using localStorage. No account is required. These preferences are not sent to GEO Arcade by this application. If browser storage is unavailable, preferences last only for the current page session.','La langue choisie et les identifiants de vos jeux favoris peuvent être enregistrés dans votre navigateur via localStorage. Aucun compte n’est requis. Cette application ne transmet pas ces préférences à GEO Arcade. Si le stockage est indisponible, les préférences durent seulement pendant la session de la page.')}</p><button class="btn secondary" id="clear-data">${t('Clear this site’s preferences','Effacer les préférences de ce site')}</button><h2>${t('No analytics or advertising scripts','Aucun script d’analyse ou de publicité')}</h2><p>${t('This version includes no analytics SDK, advertising network, tracking pixels or external fonts. It does not integrate game saves. A future hosting provider may process request information, such as IP addresses and technical logs, under its own terms. Hosting details must be added before public release.','Cette version ne comprend aucun outil d’analyse, réseau publicitaire, pixel de suivi ou police externe. Elle n’intègre pas les sauvegardes des jeux. Un futur hébergeur peut traiter des informations de requête, comme les adresses IP et les journaux techniques, selon ses propres conditions. Les détails de l’hébergement devront être ajoutés avant la sortie publique.')}</p><h2>${t('Contact drafts stay on your device','Les brouillons restent sur votre appareil')}</h2><p>${t('The contact page lets you download a message draft. It does not send or upload the text. A public support address has not been configured.','La page contact permet de télécharger un brouillon de message. Elle n’envoie ni ne téléverse le texte. Aucune adresse publique de soutien n’a été configurée.')}</p><h2>${t('Before the public launch','Avant le lancement public')}</h2><p>${t('Confirm the operator’s contact details, hosting practices, intended audience and any future consent requirements. Update this notice before adding analytics or ads.','Confirmer les coordonnées du responsable, les pratiques d’hébergement, le public visé et les éventuels besoins de consentement. Mettre à jour cet avis avant d’ajouter des statistiques ou publicités.')}</p></section>`}
function advertising(){return intro(t('Play comes first.','Le jeu avant tout.'),t('A future advertising model designed around the experience. No live advertisements are running here.','Un futur modèle publicitaire pensé autour de l’expérience. Aucune publicité active n’est diffusée ici.'))+`<section class="prose"><h2>${t('Our placement principles','Nos principes de placement')}</h2><ul><li>${t('Keep advertising outside active gameplay and away from controls.','Garder la publicité hors du jeu actif et loin des commandes.')}</li><li>${t('Label sponsored content and advertisements clearly.','Identifier clairement les publicités et contenus commandités.')}</li><li>${t('Never encourage artificial clicks or traffic.','Ne jamais encourager les clics ou le trafic artificiels.')}</li><li>${t('Review network policies and privacy requirements before enabling ads.','Examiner les politiques du réseau et les exigences de confidentialité avant d’activer les publicités.')}</li></ul><div class="ad-space">${t('Reserved advertising area · Layout example only · No ad network connected','Espace publicitaire réservé · Exemple de mise en page seulement · Aucun réseau connecté')}</div><p>${t('No advertising approval, partnership or revenue is claimed. Network selection and eligibility review will happen in a later phase.','Aucune approbation publicitaire, partenariat ou revenu n’est annoncé. Le choix du réseau et l’évaluation de l’admissibilité viendront dans une phase ultérieure.')}</p></section>`}
function contact(){return intro(t('Got something to share?','Quelque chose à partager?'),t('A bug, an idea, a small detail that could be better. We’re making room for player feedback.','Un bogue, une idée, un détail à améliorer. Nous préparons un espace pour les commentaires des joueurs.'))+`<section class="prose"><div class="notice">${t('Contact is not connected yet. This form only downloads a draft to your device; nothing is sent.','Le contact n’est pas encore connecté. Ce formulaire télécharge seulement un brouillon sur votre appareil; rien n’est envoyé.')}</div><form id="contact-form" class="contact-form"><label>${t('Topic','Sujet')}<select name="topic"><option>${t('General feedback','Commentaire général')}</option><option>${t('Report a bug','Signaler un bogue')}</option><option>${t('Accessibility','Accessibilité')}</option><option>${t('Business inquiry','Demande commerciale')}</option></select></label><label>${t('Your name (optional)','Votre nom (facultatif)')}<input name="name" autocomplete="name" maxlength="100"></label><label>${t('Message','Message')}<textarea name="message" required minlength="5" maxlength="5000" placeholder="${t('What’s on your mind?','Que souhaitez-vous partager?')}"></textarea></label><button class="btn" type="submit">${t('Download message draft','Télécharger le brouillon')} ↓</button></form><p>${t('The public support address will be added before launch. Please do not include passwords, payment information or other sensitive details.','L’adresse publique de soutien sera ajoutée avant le lancement. Veuillez ne pas inclure de mots de passe, de renseignements de paiement ou d’autres données sensibles.')}</p></section>`}
let toastTimer;function toast(s){$('#toast').textContent=s;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),3000)}
function render(){const path=location.hash.slice(1)||'/';let content,title;if(path==='/'){content=home();title=t('A different kind of playground','Un autre terrain de jeu')}else if(path==='/library'||path==='/favorites'){content=collection(path==='/favorites');title=path==='/favorites'?t('Favorites','Favoris'):t('Game library','Collection de jeux')}else if(path.startsWith('/game/')){const g=games.find(x=>x.id===path.slice(6));content=g?detail(g):intro(t('World not found.','Univers introuvable.'),t('Choose a game from the collection.','Choisissez un jeu dans la collection.'))+'<a class="btn" href="#/library">'+t('View games','Voir les jeux')+'</a>';title=g?g.name:t('Page not found','Page introuvable')}else{const routes={'/updates':updates,'/about':about,'/privacy':privacy,'/contact':contact,'/advertising':advertising};content=routes[path]?routes[path]():intro(t('Page not found.','Page introuvable.'),t('Return to the collection to continue exploring.','Retournez à la collection pour continuer.'))+'<a class="btn" href="#/library">'+t('Explore','Explorer')+'</a>';title=({'/updates':t('Updates','Actualités'),'/about':t('About','À propos'),'/privacy':t('Privacy','Confidentialité'),'/contact':t('Contact','Contact'),'/advertising':t('Advertising','Publicité')})[path]||'404'}$('#main').innerHTML=content.replaceAll('↗','<svg class="arrow-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19L19 5M5 5h14v14"/></svg>');document.title=title+' — GEO Arcade';document.documentElement.lang=lang;$('#language').textContent=lang==='en'?'FR':'EN';$('#language').setAttribute('aria-label',t('Switch to French','Passer en anglais'));$('.skip').textContent=t('Skip to content','Aller au contenu');$('.saved-link').setAttribute('aria-label',t('Favorites','Favoris'));$('.header nav').setAttribute('aria-label',t('Main navigation','Navigation principale'));$('#saved-count').textContent=favorites.filter(id=>games.some(g=>g.id===id)).length;document.querySelectorAll('[data-en]').forEach(el=>{el.textContent=el.dataset[lang];el.classList.toggle('active',el.getAttribute('href')==='#'+path)});$('#footer-tag').textContent=t('Original worlds. Independent spirit. Your next adventure is taking shape.','Univers originaux. Esprit indépendant. Votre prochaine aventure prend forme.');$('#privacy-link').textContent=t('Privacy','Confidentialité');$('#contact-link').textContent=t('Contact','Contact');$('#advertising-link').textContent=t('Advertising','Publicité');$('#footer-status').textContent=t('PRE-LAUNCH / V0.1','AVANT LANCEMENT / V0.1');if($('#game-grid'))updateGrid(path==='/favorites');if($('#search'))$('#search').addEventListener('input',e=>{query=e.target.value;updateGrid(path==='/favorites')});if($('#contact-form'))$('#contact-form').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target),text=['GEO ARCADE — '+t('UNSENT MESSAGE DRAFT','BROUILLON NON ENVOYÉ'),f.get('topic'),f.get('name'),'',f.get('message')].join('\n');const u=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='geo-arcade-message.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);toast(t('Draft downloaded. Nothing was sent.','Brouillon téléchargé. Rien n’a été envoyé.'))});if($('#clear-data'))$('#clear-data').onclick=()=>{favorites=[];try{localStorage.removeItem('geo.favorites');localStorage.removeItem('geo.language')}catch{}render();toast(t('Stored preferences cleared.','Préférences enregistrées effacées.'))}}
document.addEventListener('click',e=>{const f=e.target.closest('[data-fav]');if(f){const id=f.dataset.fav;if(favorites.includes(id))favorites=favorites.filter(x=>x!==id);else favorites.push(id);const persisted=store.set('geo.favorites',favorites);const y=scrollY;render();scrollTo(0,y);const next=document.querySelector(`[data-fav="${id}"]`);if(next)next.focus({preventScroll:true});toast(persisted?t('Favorites updated.','Favoris mis à jour.'):t('Updated for this session. Browser storage is unavailable.','Mis à jour pour cette session. Stockage du navigateur indisponible.'))}const c=e.target.closest('[data-category]');if(c){category=c.dataset.category;document.querySelectorAll('[data-category]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.category===category));updateGrid(location.hash==='#/favorites')}});
$('#language').onclick=()=>{lang=lang==='en'?'fr':'en';store.set('geo.language',lang);render()};window.addEventListener('hashchange',()=>{category='all';query='';render();updateCoinUI();scrollTo(0,0);$('#main').focus({preventScroll:true})});window.addEventListener('focus',updateCoinUI);window.addEventListener('storage',e=>{if(e.key===TOWER_SAVE_KEY)updateCoinUI()});render();updateCoinUI();

$('.skip').onclick=e=>{e.preventDefault();$('#main').focus();$('#main').scrollIntoView()};
</script></body></html>
